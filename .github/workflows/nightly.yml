name: Build unsigned Aidoku IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build unsigned iOS IPA
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.0"

      - name: Prepare logs and show environment
        run: |
          mkdir -p build-logs
          {
            sw_vers
            xcodebuild -version
            xcode-select -p
            swift --version
          } | tee build-logs/environment.txt

      - name: Install iOS platform if needed
        run: |
          set -o pipefail
          xcrun simctl list > /dev/null
          xcodebuild -downloadPlatform iOS 2>&1 | tee build-logs/download-platform.txt

      - name: Get commit SHA
        id: commitinfo
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "sha_full=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: List schemes
        run: |
          set -o pipefail
          xcodebuild -list -project Aidoku.xcodeproj 2>&1 | tee build-logs/schemes.txt

      - name: Archive unsigned Aidoku iOS app
        run: |
          set -o pipefail
          xcodebuild \
            -project Aidoku.xcodeproj \
            -scheme "Aidoku (iOS)" \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath build/Aidoku.xcarchive \
            -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY= \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive 2>&1 | tee build-logs/archive.txt

      - name: Package unsigned IPA
        run: |
          set -o pipefail
          APP_PATH="build/Aidoku.xcarchive/Products/Applications/Aidoku.app"
          test -d "$APP_PATH"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          /usr/bin/zip -qry "Aidoku-iOS-unsigned-${{ steps.commitinfo.outputs.sha_short }}.ipa" Payload
          cp "Aidoku-iOS-unsigned-${{ steps.commitinfo.outputs.sha_short }}.ipa" Aidoku-iOS-unsigned-latest.ipa
          shasum -a 256 "Aidoku-iOS-unsigned-${{ steps.commitinfo.outputs.sha_short }}.ipa" | tee build-logs/sha256.txt
          ls -lh "Aidoku-iOS-unsigned-${{ steps.commitinfo.outputs.sha_short }}.ipa" | tee build-logs/ipa.txt

      - name: Upload unsigned IPA artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Aidoku-iOS-unsigned-${{ steps.commitinfo.outputs.sha_short }}
          path: Aidoku-iOS-unsigned-${{ steps.commitinfo.outputs.sha_short }}.ipa
          if-no-files-found: error

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Aidoku-build-logs-${{ steps.commitinfo.outputs.sha_short }}
          path: build-logs
          if-no-files-found: ignore

      - name: Publish unsigned IPA to GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: aidoku-unsigned-nightly
          name: "Aidoku unsigned nightly IPA"
          body: |
            Unsigned Aidoku IPA built from this fork.

            - Commit: `${{ steps.commitinfo.outputs.sha_full }}`
            - Short SHA: `${{ steps.commitinfo.outputs.sha_short }}`
            - Scheme: `Aidoku (iOS)`
            - Configuration: `Release`
            - Code signing: disabled

            This IPA is unsigned. Re-sign it with your own certificate and provisioning profile before installing.
          files: |
            Aidoku-iOS-unsigned-${{ steps.commitinfo.outputs.sha_short }}.ipa
            Aidoku-iOS-unsigned-latest.ipa
            build-logs/sha256.txt
          prerelease: true
          make_latest: true
          overwrite_files: true
